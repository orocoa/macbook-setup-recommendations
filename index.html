<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>MacBook 设置建议</title>
    <link rel="stylesheet" href="./visuals.css?v=20261009-release" />
    <link rel="stylesheet" href="./styles.css?v=20261009-release" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="project-identity">
          <h1 class="brand">Mac Setup</h1>
        </div>
        <div class="language-switch" role="group" aria-label="语言 / Language">
            <span aria-hidden="true">[</span>
            <button type="button" data-language="zh-CN" aria-pressed="true">中</button>
            <span aria-hidden="true">/</span>
            <button type="button" data-language="en" aria-pressed="false">EN</button>
            <span aria-hidden="true">]</span>
        </div>
      </header>

      <section id="guide-view" class="view browser-layout" aria-label="Mac Setup">
        <aside id="settings-overview" class="settings-browser" aria-label="设置列表">
          <div class="settings-browser-contents">
            <label class="search-field">
              <input id="setting-search" type="search" placeholder="搜索设置" aria-label="搜索设置" autocomplete="off" />
              <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5" /><path d="m15 15 6 6" /></svg></span>
            </label>
            <div class="settings-list">
              <p id="status" role="status">正在读取设置…</p>
              <button id="retry" type="button" hidden>重新加载</button>
              <ul id="settings-list"></ul>
              <div class="empty-list" id="search-empty-state" hidden>
                <p id="empty-message">没有找到相关设置</p>
                <button id="clear-search" type="button">清除搜索</button>
              </div>
            </div>
          </div>
        </aside>

        <article id="setting-detail" class="setting-detail" hidden></article>
      </section>
      <footer class="guide-footer">
        <p id="guide-caption">方框用于记录修改进度；设置需要在 Mac 上手动调整。</p>
      </footer>
    </main>
    <script type="module" src="./app.js?v=20261009-release"></script>
  </body>
</html>
