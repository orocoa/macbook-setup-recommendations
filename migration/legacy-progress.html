<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MacSetup · 导入旧站进度</title><style>body{max-width:680px;margin:12vh auto;padding:24px;font:18px/1.7 -apple-system,system-ui,sans-serif;color:#111}button{font:inherit;padding:12px 20px;background:#111;color:white;border:0}a{color:inherit}</style><h1>MacSetup</h1><p>导入旧站进度 / Import previous progress</p><p id="status"></p><p>原记录会保留。只传输 MacSetup 已处理项目与语言偏好，不会修改 Mac 设置。<br>Original records stay here. Only MacSetup progress and language are transferred.</p><button id="transfer">前往新站确认导入 / Continue</button><p><a href="https://macsetup.kai-nex.com/">打开新站 / Open MacSetup</a></p><script>
const ids=["finder-path-bar", "finder-show-all-file-extensions", "trackpad-tap-to-click", "trackpad-tracking-speed", "dock-hide-suggested-recent-apps", "dock-minimize-windows-into-application-icon", "hot-corners-desktop-and-display-sleep", "menu-bar-customize-controls", "finder-keep-folders-on-top", "finder-customize-toolbar", "keyboard-switch-input-source-by-document", "apple-watch-auto-unlock", "trackpad-three-finger-drag", "mos-separate-mouse-scroll-direction", "keyboard-shortcuts-quick-actions"];let completed=[],language=null;
try{const saved=JSON.parse(localStorage.getItem('mac-setup-completed-v1'))||{};completed=ids.filter(id=>saved[id]===true);const lang=localStorage.getItem('mac-setup-language-v1');if(['zh-CN','en'].includes(lang))language=lang;document.getElementById('status').textContent=completed.length+' 项已处理 / handled recommendations';}catch{document.getElementById('status').textContent='无法读取浏览器记录 / Browser storage unavailable';document.getElementById('transfer').disabled=true;}
document.getElementById('transfer').onclick=()=>{location.href='https://macsetup.kai-nex.com/'+(language==='en'?'en/':'')+'#macsetup-progress='+encodeURIComponent(JSON.stringify({version:1,completed,language}));};
</script></html>
